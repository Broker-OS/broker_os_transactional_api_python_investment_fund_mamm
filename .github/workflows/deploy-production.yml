name: Deploy a Producción

# Se dispara al hacer push a `production` (o manualmente desde la pestaña Actions).
# Ejecuta scripts/deploy.py, que por SSH sube el código, corre las migraciones y
# reinicia el servicio. Las credenciales vienen de los Secrets del repo:
#   DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_PASSWORD,
#   DEPLOY_REMOTE_DIR, DEPLOY_SERVICE_NAME, DEPLOY_HEALTH_PORT
# (Settings -> Secrets and variables -> Actions -> New repository secret)
#
# El `.env` y el `venv` DEL SERVIDOR no se tocan: el deploy los preserva. Los
# secretos de la app (MAM_API_KEY, clave de cifrado MT5, DB) viven solo allá.

on:
  push:
    branches: [production]
  workflow_dispatch: {}

# Evita despliegues en paralelo pisándose entre sí.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Verificar reglas del contrato MAM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Estas reglas no necesitan base ni red: validan lo que el cliente exige
      # antes de salir a la API del proveedor. Si fallan, no se despliega.
      - name: Tests del cliente MAM
        run: python tests/test_mam_client.py

      # La firma HMAC es la UNICA autenticacion del endpoint publico
      # /webhooks/mam: ahi no hay API key que valga. Un fallo aca significa que
      # cualquiera podria inyectar un evento de terminacion.
      - name: Test de la firma del webhook
        run: python tests/test_webhook_signature.py

      # Un fallo del filtro de redaccion tiene dos caras y ninguna se ve sola:
      # o se filtra un secreto a los logs, o se suprime TODO log del servicio.
      - name: Test de redaccion de secretos en logs
        run: python tests/test_log_redaction.py

  deploy:
    name: Desplegar al server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar paramiko
        run: pip install "paramiko==3.5.0"

      - name: Armar .env con credenciales de deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          DEPLOY_HEALTH_PORT: ${{ secrets.DEPLOY_HEALTH_PORT }}
        run: |
          {
            echo "DEPLOY_SSH_HOST=${DEPLOY_SSH_HOST}"
            echo "DEPLOY_SSH_USER=${DEPLOY_SSH_USER}"
            echo "DEPLOY_SSH_PASSWORD=${DEPLOY_SSH_PASSWORD}"
            echo "DEPLOY_REMOTE_DIR=${DEPLOY_REMOTE_DIR}"
            echo "DEPLOY_SERVICE_NAME=${DEPLOY_SERVICE_NAME}"
            echo "DEPLOY_HEALTH_PORT=${DEPLOY_HEALTH_PORT}"
          } > .env

      - name: Validar que existan los secrets
        run: |
          if ! grep -q '^DEPLOY_SSH_HOST=.\+' .env; then
            echo "::error::Faltan los Secrets de deploy (DEPLOY_SSH_*). Cargalos en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy (SSH -> upload -> migrate -> restart)
        run: python scripts/deploy.py

      # /health devuelve 503 si la base no responde, asi que `curl -f` ya
      # distingue "el proceso esta arriba" de "el servicio puede operar".
      - name: Verificar que el servicio responda
        run: |
          URL="https://transactionalapi.branchtech.co/mam/health"
          BODY=""
          for i in 1 2 3 4 5; do
            if BODY=$(curl -fsS --max-time 10 "$URL"); then
              echo "$BODY"
              # Las observaciones de configuracion no tumban el health (el
              # servicio levanta igual), pero no pueden pasar en silencio: cada
              # una es una funcion que va a fallar recien cuando alguien la use.
              if ! echo "$BODY" | grep -qE '"critical": ?0'; then
                echo "::warning::El servicio respondió pero hay configuración CRITICAL pendiente. Revisar GET /mam/api/v1/mam/ops/readiness."
              fi
              echo "OK"; exit 0
            fi
            echo "intento $i sin respuesta o 503, reintentando..."; sleep 5
          done
          echo "::error::El servicio no respondió sano en $URL (¿base caída? ver journalctl -u broker-os-mam)"
          exit 1
